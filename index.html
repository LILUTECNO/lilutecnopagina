<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08020F" />
    <meta name="description"
      content="LiluTecno - Tecnología Mundial a Tu Alcance!"
    />
    <script>
      // Anti-flicker: aplica el tema guardado ANTES de pintar el primer frame,
      // evitando un flash de color incorrecto al cargar. Escribe clase .dark Y
      // data-theme en sincronía (mirroring) para que los tokens TRON apliquen
      // desde el primer paint y nunca destelle el tema equivocado.
      (function () {
        try {
          var t = localStorage.getItem('lilu-theme-v2');
          if (t !== 'light' && t !== 'dark') {
            // Fall back a prefers-color-scheme si no hay preferencia guardada.
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
              ? 'light' : 'dark';
          }
          var root = document.documentElement;
          if (t === 'light') {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#F5F4FC');
          } else {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            var md = document.querySelector('meta[name="theme-color"]');
            if (md) md.setAttribute('content', '#07070F');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" /><link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="shortcut icon" href="/favicon.ico" /><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" /><link rel="manifest" href="/site.webmanifest" />
    <title>LiluTecno</title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c7c7c7;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3;
      }
      html {
        scrollbar-width: thin;
        scrollbar-color: #c7c7c7 #f1f1f1;
      }
      @keyframes modalAppear {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-modal-appear {
        animation: modalAppear 0.3s ease-out forwards;
      }
      @keyframes slideInRight {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.3s ease-out forwards;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- TRON re-skin: display + wordmark + body faces (cargadas aditivamente; legacy fonts quedan como fallback). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://checkout.wompi.co/widget.js"></script>
</head>
  <body class="bg-[#F9F9F8]">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
